services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hackathon_nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://nexus:nexus@db:5432/hackathon_nexus
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  db_data:
