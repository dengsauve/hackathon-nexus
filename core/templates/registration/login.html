<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Hackathon Nexus</title>
</head>
<body>
  <h1>Login</h1>
  {% if form.errors %}
    <p style="color:red;">Invalid credentials, try again.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
  </form>
</body>
</html>
